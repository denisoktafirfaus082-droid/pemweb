<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobi - M. Denis Oktafirdaus</title>
  <!-- Google Fonts & Font Awesome untuk Ikon -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.7;
    }

    /* Navigasi Modern */
    nav {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px 25px;
      margin-bottom: 35px;
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    nav a:hover, nav a.active {
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* Kontainer Utama dengan Efek Glassmorphism */
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 15px;
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h2:first-of-type {
      margin-top: 0;
    }

    h2 i {
      color: #60a5fa;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 15px;
    }

    /* Styling List Hobi */
    ul, ol {
      list-style: none;
      padding: 0;
      margin-bottom: 20px;
    }

    li {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 18px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      color: #e2e8f0;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    li:hover {
      background: rgba(37, 99, 235, 0.2);
      border-color: #3b82f6;
      transform: translateX(5px);
    }

    li i {
      color: #60a5fa;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Menu Navigasi -->
  <nav>
    <a href="profile.html">Profile</a>
    <a href="about-me.html">About Me</a>
    <a href="educations.html">Educations</a>
    <a href="course-schedule.html">Course Schedule</a>
    <a href="hobbies.html" class="active">Hobbies</a>
    <a href="form.html">Form</a>
    <a href="table1.html">Table 1</a>
    <a href="table2.html">Table 2</a>
  </nav>

  <div class="container">
    <h2><i class="fa-solid fa-heart"></i> Hobi</h2>
    <p>Beberapa hobi saya adalah:</p>
    <ul>
      <li><i class="fa-solid fa-volleyball"></i> Voli</li>
      <li><i class="fa-solid fa-person-running"></i> Lari</li>
    </ul>

    <h2><i class="fa-solid fa-medal"></i> Urutan Hobi Favorit</h2>
    <ol type="A">
      <li><i class="fa-solid fa-trophy text-yellow-400"></i> Voli</li>
    </ol>
  </div>

</body>
</html>
